# Checks that pass on a clean clone: no .local/ locator, no case material. The full gate (`bun run --bun gate`:
# build, e2e, parity, verify:pilot:v5) needs local case data and runs on a worker's machine.
name: CI

on:
  pull_request:
  push:
    branches: [dev, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The runner is a VM on pc1 (docs/ci-runner.md) that runs only this repository's own code, so a pull request
    # from a fork never reaches it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, clearcase-pc1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: scripts/ci/install-chrome.sh
      - run: bun install --frozen-lockfile
      - run: scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base HEAD --name check --tool bun -- bun run --bun check
      - run: scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base HEAD --name test --tool bun -- bun run --bun test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: ignore
