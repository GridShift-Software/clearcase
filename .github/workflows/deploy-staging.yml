# Deploys staging on every merge into the hosted-demo sprint branch (docs/sprint/README.md). The deploy script is ticket
# 02's (scripts/deploy-staging.sh); until it exists the job only says so. The job runs on pushes to that one branch of
# this repository, never for a pull request, so the Cloudflare secrets reach only code a writer merged. Deploys use
# `bunx wrangler` inside the script: cloudflare/wrangler-action is not an allowed action (docs/ci-runner.md).
name: Deploy staging

on:
  push:
    branches: [sprint/hosted-demo-20261105]

permissions:
  contents: read

# Never cancel a deploy in progress; GitHub keeps the newest pending run, and the last push always deploys.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'GridShift-Software/clearcase' && github.event_name == 'push' &&
      github.ref == 'refs/heads/sprint/hosted-demo-20261105'
    runs-on: [self-hosted, Linux, X64, clearcase-pc1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -f scripts/deploy-staging.sh ]; then
            bun install --frozen-lockfile
            bash scripts/deploy-staging.sh
          else
            echo "no deploy script yet"
          fi
