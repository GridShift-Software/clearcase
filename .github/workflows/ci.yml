# Checks that pass on a clean clone: no .local/ locator, no case material. The full gate (`bun run --bun gate`:
# build, e2e, parity, verify:pilot:v5) needs local case data and runs on a worker's machine.
name: CI

on:
  pull_request:
  push:
    branches: [dev, 'feature/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The browser unit tests (tests/case-package/render.test.ts, tests/e2e/pilot/lib/lifecycle.test.ts) look for
      # Chrome for Testing 148.0.7778.96 in Playwright's cache layout, full Chrome and the headless shell.
      - name: Install Chrome for Testing 148.0.7778.96
        run: |
          set -euo pipefail
          base=https://storage.googleapis.com/chrome-for-testing-public/148.0.7778.96/linux64
          fetch() { # zip name, its sha256, Playwright cache directory
            curl -fsSLo "$RUNNER_TEMP/$1.zip" "$base/$1.zip"
            echo "$2  $RUNNER_TEMP/$1.zip" | sha256sum -c -
            mkdir -p "$HOME/.cache/ms-playwright/$3"
            unzip -q "$RUNNER_TEMP/$1.zip" -d "$HOME/.cache/ms-playwright/$3"
          }
          fetch chrome-linux64 e58a0612f6156ad287ff392c681f6e1154d0c938feccf631d0c5d7abf3bbf81a chromium-1223
          fetch chrome-headless-shell-linux64 88817c574c1838a39f88fda0bbd043b4481fd385fb10e92c323e230844d636ce chromium_headless_shell-1223
      # Those tests run Chromium offline in their own network namespace (unshare -rn), which Ubuntu 24.04's AppArmor
      # policy refuses to unprivileged users by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run --bun check
      - run: bun run --bun test
