# Checks that pass on a clean clone: no .local/ locator, no case material. The full gate (`bun run --bun gate`:
# build, e2e, parity, verify:pilot:v5) needs local case data and runs on a worker's machine.
name: CI

# Pull requests (tested on GitHub's merge commit), pushes to dev and manual runs. A push to a feature branch runs nothing
# until its pull request exists: the PR's run replaced a duplicate push run of the same commit that held the single
# runner for 110-140 s, and the worker's local gate covers the branch before that.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a pull request replaces a superseded one, so the single runner isn't kept busy by stale commits. Pushes,
# including to dev, never cancel a run in progress, but GitHub keeps at most one pending run per group and replaces it
# with a newer one, so quick successive pushes can lose the middle commits' results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The runner is a VM on pc1 (docs/ci-runner.md) that runs only this repository's own code. This guard skips a fork's
    # pull request, but the control is the repository's private, no-forking and no-fork-workflows settings: a fork
    # could supply its own workflow file with these labels.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clearcase-pc1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Written before the checks, so a failing check still uploads it. Only ids, names and SHAs, no environment dump.
      - run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 - "$RUNNER_TEMP/receipts/run-metadata.json" <<'PY'
          import json, os, subprocess, sys
          keys = ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME", "GITHUB_REF", "RUNNER_NAME", "PR_HEAD_SHA")
          meta = {k: os.environ.get(k, "") for k in keys}
          meta["checkout_head"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(sys.argv[1], "w") as f:
              json.dump(meta, f, indent=2)
          PY
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: scripts/ci/install-chrome.sh
      - run: bun install --frozen-lockfile
      - name: check
        run: scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base origin/dev --name check --tool bun -- bun run --bun check
      # Temporary files on tmpfs, as on workers' machines, where /tmp is tmpfs: on the VM's disk SQLite's
      # synchronous=FULL commits made the step about 40% slower. Six workers on four vCPUs, because the lock tests spend
      # most of their time asleep. docs/ci-runner.md has the measurements.
      - name: test
        run: |
          tmp=$(mktemp -d /dev/shm/clearcase-ci-test.XXXXXX)
          trap 'rm -rf "$tmp"' EXIT
          TMPDIR=$tmp CLEARCASE_TEST_TMP=$tmp scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base origin/dev --name test --tool bun -- \
            bun run --bun test --maxWorkers=6 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/receipts/vitest.json"
      # Fails the job unless both receipts are PASS for this checkout and every tracked test file ran with no failed or
      # skipped test; writes the job summary and summary.json, which name each problem and how to reproduce it.
      - name: summary
        if: always()
        run: bun scripts/ci/summary.ts "$RUNNER_TEMP/receipts" check test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
