<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Navigation options (GRS-89) · ClearCase</title>
<!--
  PROTOTYPE, throwaway (GRS-89). Not app code: no SvelteKit route, no store, no network.
  Plan: two structurally different navigation variants on one page, switched by ?variant=A|B and a floating bar.
  Question: where should users find existing capabilities in a large legal case, while keeping evidence context and
  mobile quick work (notes, time)?
    A  Topic sidebar: resources grouped by topic in a persistent sidebar, section navigation inside a view.
    B  Task-led case desk: top-level task navigation, the task's tools as a strip, contextual tools beside the work,
       and a quick-capture panel reachable from anywhere.
  Shared (so only navigation differs): synthetic case data, search, forms and drafts, the original viewer and its
  history/focus behaviour, publication-version selection, tables and style tokens.
  All case content below is invented. Nothing is fetched, stored or sent; state lives in memory until reload.
-->
<style>
:root{--ink:#1d232b;--bg:#fafafa;--line:#d9dde3;--soft:#eceef1;--nav:#1d2b3a;--nav-2:#2c3e52;--on-nav-muted:#d7dee8;--link:#0b4f9c;--muted:#555;--faint:#666;--focus:#d35400;--ok:#1d5b1d;--ok-bg:#e3f4e3;--warn:#6a4b00;--warn-bg:#fff1c2;--bad:#7a1010;--bad-bg:#fde8e8;--plan:#4b2f86;--plan-bg:#f1ecfa;--cite-bg:#eef4fb;--cite-line:#b9cde6;--viewer-w:min(46vw,640px);--sw-h:44px;--sw-bottom:12px;color-scheme:light;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-bottom:calc(var(--sw-h) + var(--sw-bottom) + 24px)}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus,h2:focus,main:focus{outline:none}
h1,h2,h3{line-height:1.25}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:#fff;color:var(--ink);padding:.4rem .8rem}
.skip:focus{left:.5rem;top:.5rem}
.muted{color:var(--muted)}.small{font-size:.86em}.nowrap{white-space:nowrap}
.h3{font-size:1rem;margin:0 0 .3rem}
.btn{font:inherit;line-height:1.2;border:1px solid #8c96a3;background:#fff;color:var(--ink);border-radius:4px;padding:.3rem .65rem;cursor:pointer;min-height:32px;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.btn:hover{background:#f1f4f8}
.btn.primary{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.primary:hover{background:var(--nav-2)}
.btn.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{font:inherit;background:none;border:0;padding:0 .1rem;min-height:28px;display:inline-flex;align-items:center;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
.cite{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--cite-bg);border:1px solid var(--cite-line);color:var(--link);border-radius:3px;padding:0 .4rem;min-height:26px;display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}
.cite:hover{background:#dde9f7}
.returned{animation:ret 1.8s ease-out}
@keyframes ret{0%{box-shadow:0 0 0 5px #f6b26b}100%{box-shadow:0 0 0 0 transparent}}
.tag{display:inline-block;font-size:.78em;border-radius:3px;padding:0 .35rem;border:1px solid var(--line);background:#f6f7f9;white-space:nowrap}
a.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 .45rem;text-decoration:none;color:var(--link)}
a.tag:hover{text-decoration:underline}
.tag.A{background:#e8f0fe;border-color:#b6c9ef}.tag.B{background:#fdf0e3;border-color:#efc9a1}.tag.C{background:#eef6ea;border-color:#bcd8b0}
.tag.built{background:var(--ok-bg);border-color:#a8d3a8;color:var(--ok)}
.tag.planned{background:var(--plan-bg);border-color:#cbbbe8;color:var(--plan)}
.tag.warn{background:var(--warn-bg);border-color:#e8cf7a;color:var(--warn)}
.proto-flag{background:var(--warn-bg);color:var(--warn);border:1px solid #e8cf7a;border-radius:6px;padding:.45rem .7rem;margin:.2rem 0 .7rem}
.plan-flag{background:var(--plan-bg);color:var(--plan);border:1px dashed #a891d6;border-radius:6px;padding:.55rem .8rem;margin-bottom:.7rem}
.ph-box{background:#fff;border:1px dashed #999;border-radius:6px;padding:.7rem .9rem;max-width:60rem}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.6rem .8rem;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(15rem,100%),1fr));gap:.7rem;margin-bottom:1rem}
.card h2,.card h3{margin:0 0 .25rem;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.big{font-size:1.5rem;font-weight:650;font-variant-numeric:tabular-nums}
.table-scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
.t th,.t td{padding:3px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
.t thead th{position:sticky;top:0;background:#f6f7f9;font-weight:600;white-space:nowrap}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t.wide{min-width:46rem}
.filters{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:end;margin:.3rem 0 .6rem}
.filters label{display:flex;flex-direction:column;font-size:.85em;color:var(--muted);gap:.15rem}
.filters .grow{flex:1 1 18rem}
.filters .grow input{width:100%}
.scope{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:center}
.scope legend{font-size:.85em;color:var(--muted);padding:0;float:left;margin-right:.4rem}
.scope label{flex-direction:row;align-items:center;gap:.25rem;color:var(--ink);font-size:.95em;min-height:30px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #8c96a3;border-radius:4px;padding:.3rem .45rem;max-width:100%}
input[type=checkbox],input[type=radio]{width:18px;height:18px;margin:.1rem .25rem .1rem 0;flex:none}
.qform{display:grid;gap:.3rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;max-width:34rem;min-width:0}
.qform label{font-weight:600;font-size:.9em}
.qform textarea,.qform input[type=text],.qform select{width:100%}
.qf-title{margin:0 0 .1rem;font-size:1rem}
.qf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.qf-grid>div{display:grid;gap:.2rem;min-width:0}
.qf-grid input,.qf-grid select{width:100%}
.check{display:flex;gap:.45rem;align-items:flex-start;font-weight:400!important;min-height:32px;padding:.2rem 0}
.check input{margin-top:.1rem}
.err{color:var(--bad);margin:0;font-weight:600}
.err:empty,.confirm:empty{display:none}
.confirm{margin:.2rem 0 0;color:var(--ok);background:var(--ok-bg);border:1px solid #a8d3a8;border-radius:4px;padding:.4rem .55rem;font-weight:600}
[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem 1rem;align-items:start;margin-bottom:.6rem}
.page-head h1{margin:0;font-size:1.45rem}
.crumb{margin:0 0 .15rem;font-size:.85em;color:var(--muted)}
.sub{margin:.15rem 0 0;color:var(--muted);max-width:70ch}
section.an{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.6rem .9rem;margin-bottom:.8rem;scroll-margin-top:var(--stick,80px)}
.an-head{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:baseline;justify-content:space-between}
section.an h2{font-size:1.1rem;margin:.1rem 0 .3rem}
.an p{margin:.35rem 0;max-width:75ch}
.an-actions{margin-top:.3rem}
.inline-slot:not(:empty){margin-top:.5rem}
.notes-inline{font-size:.92em;border-left:3px solid #f6b26b;padding-left:.6rem;margin:.4rem 0}
pre.out{background:#f6f7f9;border:1px solid var(--line);border-radius:6px;padding:.5rem;overflow:auto;max-width:100%;font-size:12px;max-height:16rem;margin:.3rem 0}
mark{background:#ffe58a;color:inherit}
.stages{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;padding:0;margin:.4rem 0}
.stages li{border:1px solid var(--line);border-radius:4px;padding:.25rem .55rem;background:#fff}
.stages li.done{background:var(--ok-bg);border-color:#a8d3a8}
.stages li.now{background:var(--warn-bg);border-color:#e8cf7a;font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:.25rem}
.bar>span{display:block;height:100%;background:var(--nav)}
ul.plain,ol.plain{list-style:none;padding:0;margin:0}
.list li{border-bottom:1px solid var(--soft);padding:.35rem 0;overflow-wrap:anywhere}
.res{margin-bottom:1rem}
.res h2{font-size:1.02rem;margin:.4rem 0}
.res .count,.count{color:var(--faint);font-size:.85em;font-variant-numeric:tabular-nums;font-weight:400}
.snip{color:var(--muted);font-size:.92em;margin:.1rem 0 0 .2rem}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.25rem 1rem;margin:.6rem 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.two{display:grid;grid-template-columns:minmax(0,34rem) minmax(0,1fr);gap:1rem;align-items:start;margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.cat-group{margin-bottom:.9rem}
.cat-group h2{font-size:.95rem;margin:.3rem 0}
.cat-list li{display:grid;grid-template-columns:minmax(10rem,14rem) 9rem minmax(0,1fr);gap:.1rem .8rem;padding:.2rem 0;border-bottom:1px solid var(--soft)}
/* ---------- shared viewer: a pane beside the work on desktop, a full-screen sheet on a phone ---------- */
.viewer{position:fixed;top:0;right:0;bottom:0;width:var(--viewer-w);background:#f3f1ec;border-left:2px solid var(--nav);z-index:30;display:flex;flex-direction:column;box-shadow:-6px 0 18px rgba(0,0,0,.12)}
.viewer[hidden]{display:none}
.vw-head{background:#fff;border-bottom:1px solid var(--line);padding:.5rem .8rem;display:grid;gap:.3rem}
.vw-row{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.vw-head h2{margin:0;font-size:1.02rem;overflow-wrap:anywhere}
.vw-head p{margin:0}
.vw-body{overflow:auto;padding:.9rem;padding-bottom:calc(var(--sw-h) + 36px);flex:1}
.paper{background:#fff;max-width:36rem;margin:0 auto;padding:1.3rem 1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:Georgia,"Times New Roman",serif;font-size:14px;min-height:26rem;overflow-wrap:anywhere}
.paper .lh{font:600 11px/1.3 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--soft);padding-bottom:.4rem;margin-bottom:.8rem;display:flex;justify-content:space-between;gap:1rem}
.paper p{margin:.45rem 0}
.paper .scan{height:2.2rem;background:repeating-linear-gradient(0deg,#e9e9e9 0 2px,transparent 2px 9px);margin:.6rem 0}
.vw-note{max-width:36rem;margin:.8rem auto 0}
body.viewer-open #app{margin-right:var(--viewer-w)}
/* with the original open, the viewer takes the place of A's page rail and B's context rail */
body.viewer-open .a-withtoc,body.viewer-open .b-work{grid-template-columns:minmax(0,1fr)}
body.viewer-open .a-toc,body.viewer-open .b-context{display:none}
/* ---------- prototype chrome (not part of either design) ---------- */
.switcher{position:fixed;bottom:var(--sw-bottom);left:12px;z-index:60;display:flex;align-items:center;gap:.25rem;height:var(--sw-h);max-width:calc(100vw - 16px);padding:0 .3rem;background:#111;color:#fff;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);border:2px solid #f6b26b;font-size:13px}
.sw-btn{font:inherit;font-size:18px;line-height:1;width:34px;height:34px;border-radius:50%;border:0;background:#333;color:#fff;cursor:pointer;flex:none}
.sw-btn:hover{background:#555}
.sw-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .35rem;min-width:0}
.sw-label .k{background:#f6b26b;color:#111;border-radius:3px;padding:0 .35rem;font-weight:700;margin-right:.3rem}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:80;width:max-content;max-width:min(38rem,calc(100vw - 16px));background:#10261a;color:#fff;border-radius:6px;padding:.5rem .8rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast:empty{display:none}
/* ---------- shared header pieces ---------- */
.brand{font-weight:700}
.proto-tag{font-size:.7em;font-weight:700;letter-spacing:.05em;background:#f6b26b;color:#111;border-radius:3px;padding:.05rem .35rem;white-space:nowrap}
.case-name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:.85em;display:flex;flex-wrap:wrap;gap:.1rem .9rem}
.livechips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip-s{font:inherit;font-size:.82em;text-decoration:none;border:1px solid;border-radius:999px;padding:.1rem .65rem;min-height:28px;display:inline-flex;align-items:center;white-space:nowrap;background:none;color:inherit;cursor:pointer}
.gsearch{display:flex;gap:.3rem;min-width:0}
.gsearch input{flex:1;min-width:0}
/* ---------- states, drafts, assumptions ---------- */
.pl{display:inline-block;font-size:.72em;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--plan);background:var(--plan-bg);border:1px solid #cbbbe8;border-radius:3px;padding:0 .3rem;margin-left:.3rem;white-space:nowrap}
.assume{font-size:.88em;border:1px dashed #b58b00;background:#fffbea;color:var(--warn);border-radius:5px;padding:.3rem .55rem;margin:.3rem 0}
.draft-cue{font-size:.9em;background:var(--warn-bg);border:1px solid #e8cf7a;border-radius:4px;padding:.3rem .5rem;margin:.1rem 0}
.draft-cue[hidden]{display:none}
.chip-menu{position:relative;display:inline-block}
.chip-menu>summary{list-style:none}
.chip-menu>summary::-webkit-details-marker{display:none}
.chip-menu .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;min-width:17rem;max-width:min(24rem,80vw);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:.4rem .5rem;margin:0;list-style:none}
.chip-menu .menu li{display:flex;gap:.4rem;justify-content:space-between;align-items:center;padding:.15rem 0}
.draftchip{background:var(--warn-bg)!important;color:var(--warn)!important;border-color:#e8cf7a!important;font-weight:600}
.verbox{display:inline-flex;align-items:center;gap:.3rem}
.verbox select{font-size:.95em;padding:.15rem .35rem;min-height:28px}
.banner{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;border:1px solid #e8cf7a;background:var(--warn-bg);color:var(--warn);padding:.45rem 1rem}
.banner.ok{border-color:#a8d3a8;background:var(--ok-bg);color:var(--ok)}
.banner:empty{display:none}
.opsim{border:2px dashed #7a1010;border-radius:6px;padding:.6rem .8rem;margin:.8rem 0;background:#fff7f7}
.opsim h2{margin:0 0 .3rem;font-size:1rem;color:var(--bad)}
.tl{list-style:none;margin:.4rem 0;padding:0}
.tl li{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:.1rem .8rem;padding:.25rem 0;border-bottom:1px solid var(--soft)}
.tl .when{font-variant-numeric:tabular-nums;color:var(--muted)}
.tl li.pending{color:var(--faint)}
.axes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(15rem,100%),1fr));gap:.6rem;margin:.5rem 0}
.scopebox{border:1px solid var(--line);border-radius:6px;background:#fff;padding:.5rem .8rem;margin:.6rem 0}
.scopebox legend{font-weight:600;padding:0 .3rem}
tr.hit>td{background:#fff3d6}
.opbox{border:2px dashed #7a1010;border-radius:6px;padding:.5rem .8rem;margin-top:1rem;background:#fff7f7}
.opbox h2{color:var(--bad)}
/* ---------- Variant A: topic sidebar ---------- */
.a-top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(15rem,27rem);grid-template-areas:"id search" "id chips";gap:.35rem 1.2rem;align-items:center;padding:.45rem 1rem}
.a-id{grid-area:id;min-width:0}.a-top .gsearch{grid-area:search}.a-top .livechips{grid-area:chips}
.case-name .short{display:none}
.a-top .meta{color:var(--on-nav-muted);align-items:center}
.a-top .chip-s{color:#fff;border-color:#5d7590}
.a-top .chip-s:hover{background:var(--nav-2)}
.a-top .verbox select{background:var(--nav-2);color:#fff;border-color:#5d7590}
.a-top .t1{display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:center}
.a-menu{display:none}
.a-body{display:grid;grid-template-columns:16.5rem minmax(0,1fr);align-items:start}
.a-side{position:sticky;top:var(--a-top,64px);max-height:calc(100vh - var(--a-top,64px) - 66px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:.4rem .5rem 1rem}
.a-side .drawer-head{display:none}
.a-side .side-filter{position:sticky;top:0;background:#fff;padding:.2rem 0 .4rem;z-index:1}
.a-side .side-filter input{width:100%}
.a-side details{margin:.1rem 0}
.a-side summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:.76em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.4rem .3rem;min-height:30px;cursor:pointer;border-radius:3px}
.a-side summary:hover{background:#f3f5f8}
.a-side summary::-webkit-details-marker{display:none}
.a-side summary::before{content:'\25BE';margin-right:.3rem}
.a-side details:not([open]) summary::before{content:'\25B8'}
.a-side summary span:first-child{flex:1}
.a-side details.cur summary{color:var(--ink)}
.a-side ul{list-style:none;margin:0 0 .3rem;padding:0}
.a-side a{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem .4rem;min-height:28px;align-items:center;border-radius:3px;text-decoration:none;color:var(--link)}
.a-side a:hover{background:#eef3f9}
.a-side a[aria-current=page]{background:var(--nav);color:#fff}
.a-side a[aria-current=page] .count{color:var(--on-nav-muted)}
.a-side .phm{color:var(--faint)}
.a-side .planned{border-top:1px dashed #a891d6;margin-top:.6rem;padding-top:.2rem}
.a-side .planned a{color:var(--plan)}
.a-side .side-all{margin:.2rem 0 .4rem;padding-bottom:.4rem;border-bottom:1px solid var(--soft)}
.a-side .side-all a{font-weight:600}
.a-side .nomatch{margin:.4rem .3rem}
.a-main{padding:.8rem 1.25rem 1rem;min-width:0;max-width:1300px}
.a-withtoc{display:grid;grid-template-columns:minmax(0,1fr) 13.5rem;gap:1.25rem;align-items:start}
.a-toc{position:sticky;top:calc(var(--a-top,64px) + 12px);border-left:2px solid var(--line);padding:.2rem 0 .2rem .8rem;font-size:.92em}
.a-toc h2{font-size:.76em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 .3rem}
.a-toc a{display:block;padding:.2rem 0;min-height:26px;text-decoration:none}
.a-toc a[aria-current=true]{font-weight:700;color:var(--ink)}
/* a modal sheet's dimmed backdrop; one element for the drawer, More and capture sheets */
.scrim{display:none}

.b-top{background:#fff;border-bottom:1px solid var(--line);padding:.5rem 1rem .45rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center}
.b-id{flex:1 1 22rem;min-width:0}.b-top .gsearch{flex:0 1 24rem}
.b-top .case-name{font-size:1.05rem}
.b-top .meta{color:var(--muted);align-items:center}
.b-top .chip-s{color:var(--ink);border-color:var(--line);background:#f6f7f9}

.b-status{display:none}
.chip-s .cs{display:none}
.share{margin:.1rem 0}
.sw-role select{font-size:12px;min-height:30px;background:#333;color:#fff;border:0;border-radius:999px;padding:0 .4rem;max-width:9.5rem}

.b-task span{font-size:.78em}
.b-task:hover{background:var(--nav-2)}

<noscript>This prototype needs JavaScript.</noscript>
<div id="app"></div>
<div id="scrim" class="scrim" data-action="close-ov" data-modal-ok aria-hidden="true"></div>

<script>
'use strict';
/* ====================================================================================================
   Synthetic data. Every name, number and sentence is invented for this prototype.
   ==================================================================================================== */
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const R = rng(89);
const pick = (a) => a[Math.floor(R() * a.length)];
const pad = (n, w = 4) => String(n).padStart(w, '0');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtN = (n) => Number(n).toLocaleString('en-US');
const money = (n) => 'R ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const isMobile = () => matchMedia('(max-width: 760px)').matches;
const localDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
const TODAY = localDate(new Date());
const nowStamp = () => { const d = new Date(); return `${TODAY} ${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}`; };
const RATE = 2400;

const CASE = { name: 'Kestrel Grain Logistics (Pty) Ltd v Marula Port Authority', short: 'Kestrel v Marula', forum: 'Arbitration AR-2025-118', results: 'Results v3', rv: 'rv-9f3c1e07', activated: '2026-09-04', docs: 1214, chrono: 412 };
const SHORTP = ['T. Naidoo', 'R. van der Berg', 'L. Mokoena', 'J. Ferreira', 'A. Dlamini', 'S. Pillay'];
const SUBJECTS = ['berth allocation', 'demurrage at Berth 7', 'silo 4 storage charges', 'vessel delay', 'force majeure notice', 'grain moisture readings', 'Crane 3 outage', 'payment reminder', 'tariff schedule 2025', 'without prejudice proposal', 'survey report', 'anchorage waiting times'];
const VESSELS = ['MV Sable Crest', 'MV Orca Dawn', 'MV Kudu Star', 'MV Tern Bay'];
const TYPES = ['Email', 'Email', 'Email', 'Letter', 'Invoice', 'Bill of lading', 'Minutes', 'Statement', 'Report', 'Addendum'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ISSUES = { A: 'Delay & demurrage', B: 'Force majeure', C: 'Set-off' };

function titleFor(type, n) {
  const s = pick(SUBJECTS);
  switch (type) {
    case 'Email': return `Email ${pick(SHORTP)} to ${pick(SHORTP)}: ${s}`;
    case 'Letter': return `Letter ${pick(['Kestrel', 'Marula', 'Ibis Stevedoring'])} re ${s}`;
    case 'Invoice': return `Invoice INV-${7000 + n} - ${pick(['silo storage', 'stevedoring', 'berth dues', 'surveyor fees'])}`;
    case 'Bill of lading': return `Bill of lading BL-${3100 + n} ${pick(VESSELS)}`;
    case 'Minutes': return `Minutes of site meeting ${1 + (n % 40)}`;
    case 'Statement': return `Statement of account, ${pick(MONTHS)}`;
    case 'Report': return `Berth occupancy report, week ${1 + (n % 52)}`;
    default: return `Addendum ${1 + (n % 9)} to Port Services Agreement (draft)`;
  }
}

// The eight documents the analysis cites. Each carries the passage the citation points at.
const KEY = {
  K1: { date: '2024-11-18', type: 'Contract', title: 'Port Services Agreement, signed', pages: 34, quote: { 12: 'Clause 14.2: demurrage accrues at R 38,500 per vessel day after 36 free hours, save where the delay is caused by the Authority\u2019s own equipment.' } },
  K2: { date: '2025-03-05', type: 'Letter', title: 'Letter Marula to Kestrel re Crane 3 outage', pages: 3, quote: { 2: 'Crane 3 at Berth 7 was out of service from 02:00 on 3 March 2025 because of a gearbox failure.' } },
  K3: { date: '2025-03-06', type: 'Email', title: 'Email T. Naidoo to J. Ferreira: MV Sable Crest waiting time', pages: 1, quote: { 1: 'MV Sable Crest waited 41 hours at anchorage before it was allocated Berth 7.' } },
  K4: { date: '2025-03-21', type: 'Letter', title: 'Notice of force majeure from Marula Port Authority', pages: 2, quote: { 1: 'The Authority gives notice of force majeure in respect of the events of 3 March 2025.' } },
  K5: { date: '2025-05-02', type: 'Invoice', title: 'Invoice INV-7731 - silo 4 storage, April 2025', pages: 2, quote: { 1: 'Storage, silo 4, 1 to 30 April 2025: R 412,880.00.' } },
  K6: { date: '2025-05-14', type: 'Minutes', title: 'Minutes of site meeting 9', pages: 5, quote: { 3: 'L. Mokoena confirmed that the replacement gearbox arrived on 11 March 2025.' } },
  K7: { date: '2025-09-03', type: 'Statement', title: 'Statement of account, August 2025', pages: 4, quote: { 2: 'Balance after set-off of storage charges: R 1,184,220.00.' } },
  K8: { date: '2026-02-10', type: 'Affidavit', title: 'Affidavit of T. Naidoo', pages: 14, quote: { 6: 'Paragraph 23: at no time before 21 March 2025 did the Authority call the outage force majeure.' } },
};

const DOCS = (() => {
  const start = Date.UTC(2024, 10, 1), span = Date.UTC(2026, 8, 30) - start;
  const rows = [];
  for (let i = 0; i < CASE.docs - 8; i++) {
    const type = pick(TYPES);
    rows.push({ date: new Date(start + Math.floor(R() * span)).toISOString().slice(0, 10), type, title: titleFor(type, i), pages: 1 + Math.floor(R() * (type === 'Email' ? 3 : 18)) });
  }
  for (const [key, d] of Object.entries(KEY)) rows.push({ ...d, key });
  rows.sort((a, b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
  const manual = new Set();
  while (manual.size < 16) { const i = Math.floor(R() * rows.length); if (!rows[i].key) manual.add(i); }
  rows.forEach((d, i) => {
    d.ref = 'D-' + pad(i + 1);
    d.text = manual.has(i) ? 'manual' : 'read';
    d.hay = `${d.ref} ${d.title} ${d.type} ${Object.values(d.quote || {}).join(' ')}`.toLowerCase();
  });
  return rows;
})();
const BYREF = new Map(DOCS.map((d) => [d.ref, d]));
const BYKEY = Object.fromEntries(DOCS.filter((d) => d.key).map((d) => [d.key, d]));
const MANUAL_COUNT = DOCS.filter((d) => d.text === 'manual').length;

const CHRONO = (() => {
  const keyEvents = [
    ['K1', 12, 'Port Services Agreement signed; clause 14.2 sets demurrage after 36 free hours', 'A', 'R. van der Berg, J. Ferreira'],
    ['K2', 2, 'Marula reports Crane 3 at Berth 7 out of service from 02:00 on 3 March', 'A', 'L. Mokoena'],
    ['K3', 1, 'MV Sable Crest waits 41 hours at anchorage before berthing', 'A', 'T. Naidoo'],
    ['K4', 1, 'Marula gives notice of force majeure, 18 days after the outage', 'B', 'J. Ferreira'],
    ['K5', 1, 'Marula invoices R 412,880.00 for silo 4 storage in April', 'C', 'J. Ferreira'],
    ['K6', 3, 'Replacement gearbox confirmed as arrived on 11 March', 'B', 'L. Mokoena'],
    ['K7', 2, 'Statement sets storage charges off against Kestrel\u2019s claim', 'C', 'R. van der Berg'],
    ['K8', 6, 'T. Naidoo states force majeure was first raised on 21 March', 'B', 'T. Naidoo'],
  ];
  const ev = keyEvents.map(([k, page, text, issue, actors]) => ({ date: BYKEY[k].date, text, actors, ref: BYKEY[k].ref, page, issue }));
  const pool = DOCS.filter((d) => !d.key);
  while (ev.length < CASE.chrono) {
    const d = pool[Math.floor(R() * pool.length)];
    ev.push({ date: d.date, text: `${pick(SHORTP)} ${pick(['records', 'raises', 'queries', 'confirms', 'disputes'])} ${pick(SUBJECTS)}${R() < .4 ? ' for ' + pick(VESSELS) : ''}`, actors: pick(SHORTP), ref: d.ref, page: 1 + Math.floor(R() * d.pages), issue: pick(['A', 'B', 'C', '', '', '']) });
  }
  ev.sort((a, b) => a.date.localeCompare(b.date));
  return ev;
})();

const SECTIONS = [
  { id: 'summary', short: 'Summary', title: 'Summary of the claim', paras: ['Kestrel claims demurrage and storage losses from delays at Berth 7 between March and May 2025 {K3:1}. The Authority relies on force majeure {K4:1} and has set its own storage charges off against the claim {K7:2}.'] },
  { id: 'issue-a', short: 'A \u00b7 Delay & demurrage', issue: 'A', position: 'Strong', title: 'Issue A: delay at Berth 7 and demurrage', paras: ['Clause 14.2 removes the free-time defence where the Authority\u2019s own equipment causes the delay {K1:12}.', 'The Authority admits Crane 3 failed on 3 March {K2:2}, and the vessel waited 41 hours at anchorage {K3:1}.'] },
  { id: 'issue-b', short: 'B \u00b7 Force majeure', issue: 'B', position: 'Moderate', title: 'Issue B: timing of the force majeure notice', paras: ['Notice came 18 days after the outage {K4:1}, after the replacement gearbox had already arrived {K6:3}.', 'Kestrel\u2019s deponent says nobody called the outage force majeure before 21 March {K8:6}. The clause 22 notice period still needs confirming (Info Required, item 4).'] },
  { id: 'issue-c', short: 'C \u00b7 Set-off', issue: 'C', position: 'Weak', title: 'Issue C: set-off of storage charges', paras: ['April storage is invoiced at R 412,880.00 {K5:1} and was set off in the August statement {K7:2}.', 'If Issue A succeeds, part of that storage period is attributable to the Authority\u2019s own delay.'] },
  { id: 'quantum', short: 'Quantum', title: 'Quantum position', paras: ['Demurrage at R 38,500 per vessel day {K1:12} over 4.2 delayed vessel days gives R 161,700.00 before interest. The balance claimed after set-off is R 1,184,220.00 {K7:2}.'] },
  { id: 'next', short: 'Next steps', title: 'Strategy and next steps', paras: ['Ask for the crane maintenance log. Prepare cross-examination of L. Mokoena on the gearbox timeline {K6:3}. Export a packet of the eight cited documents for counsel.'] },
];
const SEC_BY = Object.fromEntries(SECTIONS.map((s) => [s.id, s]));

const DEADLINES = [
  ['2026-10-22', 'Respondent\u2019s discovery affidavit due', 'Discovery'],
  ['2026-10-29', 'Kestrel\u2019s reply to the amended defence', 'Pleadings'],
  ['2026-11-06', 'Expert notice (marine surveyor)', 'Experts'],
  ['2026-11-20', 'Bundle index to the tribunal', 'Bundles'],
  ['2026-12-04', 'Claimant\u2019s heads of argument', 'Hearing'],
  ['2027-01-25', 'Hearing, three days', 'Hearing'],
];
const SUBMISSIONS = [
  { id: 'S-1', date: '2026-06-20', files: 812, pub: 'v1', pubDate: '2026-06-24' },
  { id: 'S-2', date: '2026-07-19', files: 236, pub: 'v2', pubDate: '2026-07-22' },
  { id: 'S-3', date: '2026-09-03', files: 166, pub: 'v3', pubDate: '2026-09-04' },
];
const S4_FILES = Array.from({ length: 58 }, (_, i) => `S4-${pad(i + 1, 3)} ${pick(['Email export', 'Invoice', 'Quay photo', 'Survey report', 'Letter', 'Berth log'])}.pdf`);

/* ====================================================================================================
   The 42 v5 views (ids, labels and v5 groups from src/lib/components/view-registry.ts at the base SHA),
   each placed in one Variant A topic and one Variant B task. built: 1 = working here, 0 = summary placeholder.
   ==================================================================================================== */
const VIEWS = [
  ['overview', 'Overview', 'Matter', 'case', 'desk', 1, null, 'Case summary, counts and processing state.'],
  ['matter', 'Matter & Strategy', 'Matter', 'case', 'argue', 1, 3, 'Issues, positions and strategy, with citations to the originals.'],
  ['timeline', 'Timeline', 'Matter', 'case', 'find', 0, 64, 'Key dates on a visual timeline.'],
  ['chronology', 'Chronology', 'Matter', 'case', 'find', 1, CASE.chrono, 'Every dated event with its source citation.'],
  ['quantum_tab', 'Quantum & Interest', 'Matter', 'money', 'numbers', 0, 9, 'Claim heads, amounts and interest.'],
  ['documents', 'Documents', 'Evidence', 'docs', 'find', 1, CASE.docs, 'The full document list with text status and originals.'],
  ['contracts_tab', 'Contracts', 'Evidence', 'docs', 'find', 0, 14, 'Agreements and their clauses.'],

  if (draftDirty(form, v)) S.drafts[key] = { kind: form.dataset.form, vals: v, at: Date.now(), label: draftLabel(form, v) }; else delete S.drafts[key];
  const cue = $('.draft-cue', form); if (cue) cue.hidden = !S.drafts[key];
  refreshDraftChips();
}

  const f = form.elements, k = form.dataset.form;
  if (k === 'time') { f.desc.value = ''; f.hours.value = '0.3'; } else if (k === 'noteedit') { const n = S.notes.find((x) => x.id === form.dataset.draft.slice(5)); f.text.value = n ? n.text : ''; } else f.text.value = '';

}

  delete S.drafts[key];
  $$('form[data-draft]').filter((f) => f.dataset.draft === key).forEach(resetForm);

  refreshDraftChips(true);
  if (key.startsWith('edit|')) refreshLive();
}

function searchResultsHTML() {
  const q = S.query.trim().toLowerCase();
  if (q.length < 2) return `<p class="muted">Type at least two characters, or try ${['gearbox', 'force majeure', 'silo 4', 'Sable Crest'].map((t) => `<button type="button" class="linkbtn" data-q="${t}">${t}</button>`).join(', ')}.</p>`;
  const sc = S.scope, out = [];
  const group = (title, n, items, more) => `<section class="res"><h2>${title} <span class="count">${fmtN(n)}</span></h2>${n ? `<ul class="plain list">${items.join('')}</ul>${n > items.length ? `<p class="muted small">First ${items.length} of ${fmtN(n)}. ${more}</p>` : ''}` : '<p class="muted">No matches.</p>'}</section>`;
  if (sc === 'all' || sc === 'docs') {
    const hits = DOCS.filter((d) => d.hay.includes(q));
    out.push(group('Documents', hits.length, hits.slice(0, 40).map((d) => {
      const qp = Object.entries(d.quote || {}).find(([, t]) => t.toLowerCase().includes(q));
      const page = qp ? Number(qp[0]) : 1;
      return `<li>${cite(d.ref, page)} ${hl(d.title, q)} <span class="muted small">· ${esc(d.type)} · ${d.date}${d.text === 'manual' ? ' · needs a manual read' : ''}</span>${qp ? `<div class="snip">“${hl(qp[1], q)}”</div>` : ''}</li>`;
    }), 'Add words to narrow it.'));
  }
  if (sc === 'all' || sc === 'events') {
    const hits = CHRONO.filter((e) => e.text.toLowerCase().includes(q));
    out.push(group('Chronology', hits.length, hits.slice(0, 40).map((e) => `<li><span class="nowrap">${e.date}</span> ${hl(e.text, q)} ${issueTag(e.issue)} ${cite(e.ref, e.page)}</li>`), `<a href="${href('chronology')}" data-nav="chronology" data-preset="chrono-q">Open all in the chronology</a>.`));
  }
  if (sc === 'all' || sc === 'notes') {
    const hits = S.notes.filter((n) => n.text.toLowerCase().includes(q));

  }
  return out.join('');
}

        + card('Recent searches', S.searches.length ? `<ul>${S.searches.slice(0, 5).map((q) => `<li><button type="button" class="linkbtn" data-q="${esc(q)}">${esc(q)}</button></li>`).join('')}</ul>` : '<p class="muted small">None yet this session.</p>') + capture;
    case 'argue': {

        + card(`Notes ${sec ? 'on this section' : 'on the analysis'} (${notes.length})`, notes.length ? `<ul>${notes.map((n) => `<li><strong>${n.id}</strong> ${esc(n.text)}</li>`).join('')}</ul>` : '<p class="muted small">None yet.</p>') + capture;
    }

    case 'system':
      return card('Planned, firm and account', `<ul>${PLANNED.filter((p) => p.task === 'system').map((p) => `<li><a href="${href(p.id)}" data-nav="${p.id}">${esc(p.label)}</a> <span class="pl">Planned</span></li>`).join('')}</ul>`) + capture;

function shellB() {
