# Checks that pass on a clean clone: no .local/ locator, no case material, no browser. The full gate
# (`bun run --bun gate`: build, e2e, parity, verify:pilot:v5) needs local case data and runs on a worker's machine.
name: CI

on:
  pull_request:
  push:
    branches: [dev, 'feature/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --bun check
      - run: bun run --bun test
