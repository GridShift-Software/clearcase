# Checks that pass on a clean clone: no .local/ locator, no case material. The full gate (`bun run --bun gate`:
# build, e2e, parity, verify:pilot:v5) needs local case data and runs on a worker's machine.
name: CI

# Pull requests (tested on GitHub's merge commit), pushes to dev and manual runs. A push to a feature branch runs nothing
# until its pull request exists: the PR's run replaced a duplicate push run of the same commit that held the single
# runner for 110-140 s, and the worker's local gate covers the branch before that.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a pull request replaces a superseded one, so the single runner isn't kept busy by stale commits. Pushes,
# including to dev, never cancel a run in progress, but GitHub keeps at most one pending run per group and replaces it
# with a newer one, so quick successive pushes can lose the middle commits' results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The runner is a VM on pc1 (docs/ci-runner.md) that runs only this repository's own code. This guard skips a fork's
    # pull request, but the control is the repository's private, no-forking and no-fork-workflows settings: a fork
    # could supply its own workflow file with these labels.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clearcase-pc1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Written before the checks, so a failing check still uploads it. Only ids, names and SHAs, no environment dump.
      - run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 - "$RUNNER_TEMP/receipts/run-metadata.json" <<'PY'
          import json, os, subprocess, sys
          keys = ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME", "GITHUB_REF", "RUNNER_NAME", "PR_HEAD_SHA")
          meta = {k: os.environ.get(k, "") for k in keys}
          meta["checkout_head"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(sys.argv[1], "w") as f:
              json.dump(meta, f, indent=2)
          PY
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: scripts/ci/install-chrome.sh
      - run: bun install --frozen-lockfile
      - name: check
        run: scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base origin/dev --name check --tool bun -- bun run --bun check
      # Temporary files on tmpfs, as on workers' machines, where /tmp is tmpfs: on the VM's disk SQLite's
      # synchronous=FULL commits made the step about 40% slower. Six workers on four vCPUs, because the lock tests spend
      # most of their time asleep. docs/ci-runner.md has the measurements.
      - name: test
        run: |
          tmp=$(mktemp -d /dev/shm/clearcase-ci-test.XXXXXX)
          trap 'rm -rf "$tmp"' EXIT
          TMPDIR=$tmp CLEARCASE_TEST_TMP=$tmp scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base origin/dev --name test --tool bun -- \
            bun run --bun test --maxWorkers=6 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/receipts/vitest.json"
      # The credential-free hosted gate (GRS-138; docs/development.md, "Hosted checks"): the hosted-gate artifact of this
      # checkout on local workerd, with local D1 and R2 under Miniflare and Chromium over loopback, in an offline network
      # namespace. Node hosts Wrangler, so this step needs a real Node (24 LTS, ADR 0008's line; Wrangler needs 22 or
      # later); workerd arrives with bun install. No Cloudflare account, binding or token reaches it: CI=1 and telemetry
      # off, and the run's D1 and R2 state (.local/hosted) and scratch live on this step's tmpfs directory. Its evidence
      # uploads with the receipts.
      #
      # PC1 run 39260890102 downloaded Node 26.10.0 into the tool cache and then failed with exit code 127 on its binary,
      # before the gate ran. The Node step may now fail without ending the job; when it does, the next step prints what
      # the guest says about the binary (kernel, mounts, the loader and libraries) and the one after puts nodejs.org's own
      # tarball of the same version first on PATH, after checking its SHA-256 against both a pinned value and nodejs.org's
      # published SHASUMS256.txt. The gate step then proves the node it will use is a real Node, not Bun's stand-in.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        continue-on-error: true
        with:
          node-version: 24.22.0
      - name: node diagnostics
        if: steps.setup-node.outcome == 'failure'
        run: |
          set +e
          bin="$RUNNER_TOOL_CACHE/node/24.22.0/x64/bin"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo '-- mounts of /home/runner and /tmp'
          mount | grep -E ' on (/|/home|/home/runner|/tmp)[ /]' | cut -c1-160
          echo '-- tool cache'
          df -h "$RUNNER_TOOL_CACHE" | tail -1
          ls -la "$bin"
          file "$bin/node"
          "$bin/node" --version; echo "node --version exit $?"
          ldd "$bin/node"
          ldconfig -p | grep -E 'libstdc\+\+|libatomic|libgcc' | head -8
          exit 0
      - name: node fallback
        id: node-fallback
        if: steps.setup-node.outcome == 'failure'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/node-fallback"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSLO https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.gz
          curl -fsSLO https://nodejs.org/dist/v24.22.0/SHASUMS256.txt
          want=28ea0a438de9a13bd7891fd758eee6c7819ee8af5442dfd8d45bd65e56d4228c
          published=$(grep ' node-v24.22.0-linux-x64.tar.gz$' SHASUMS256.txt | cut -d' ' -f1)
          [ "$published" = "$want" ] || { echo "nodejs.org publishes $published for the tarball, not the pinned $want" >&2; exit 1; }
          echo "$want  node-v24.22.0-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf node-v24.22.0-linux-x64.tar.gz
          bin="$dir/node-v24.22.0-linux-x64/bin"
          ldd "$bin/node"
          "$bin/node" --version
          echo "$bin" >> "$GITHUB_PATH"
      - name: gate-hosted
        run: |
          tmp=$(mktemp -d /dev/shm/clearcase-ci-hosted.XXXXXX)
          trap 'rm -f .local/hosted; rm -rf "$tmp"' EXIT
          mkdir -p .local "$tmp/hosted" "$tmp/scratch"
          ln -sfn "$tmp/hosted" .local/hosted
          proof='if (process.versions.bun) { console.error("node is Bun"); process.exit(3); } console.log("node " + process.execPath + " " + process.version + " (not Bun)");'
          CI=1 WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false TMPDIR=$tmp CLEARCASE_HOSTED_SCRATCH=$tmp/scratch \
            CLEARCASE_HOSTED_REPORT_DIR="$RUNNER_TEMP/receipts/hosted" \
            scripts/agent-tools/receipt --receipts "$RUNNER_TEMP/receipts" --base origin/dev --name gate-hosted --tool bun --tool node -- \
            bash -c 'node -e "$1" && exec bun run --bun gate:hosted' bash "$proof"
      # A fix round commits its review findings and the reviewed SHA under docs/acceptance/fix-rounds/
      # (docs/agent-tooling.md). The guard fails a pull request that deletes, skips, loosens or renames a test those
      # findings name, that changes the test code, runner configuration or fixtures they depend on, or that deletes a
      # manifest. It checks the pull request's own head, not the merge commit, and runs under Bun because the runner has
      # no Node. The guard itself is the base branch's copy, checked out beside the head with the installed
      # node_modules: a pull request cannot weaken the check that judges it. A pull request labelled fix-round must
      # carry a manifest; the coordinator's ledger has no copy here, so the label is how CI learns of a fix round. A
      # push to dev ran it in its pull request.
      - name: test guard
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          FIX_ROUND_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'fix-round') }}
        run: |
          head=$RUNNER_TEMP/pr-head
          base_tools=$RUNNER_TEMP/base-tools
          git worktree prune
          git worktree add -q --detach "$head" "$PR_HEAD_SHA"
          trap 'git worktree remove --force "$head"; git worktree remove --force "$base_tools" 2>/dev/null || true' EXIT
          runner=scripts/agent-tools/fix-round-guard
          if git cat-file -e "origin/$BASE_REF:scripts/agent-tools/fix-round-guard" 2>/dev/null; then
            git worktree add -q --detach "$base_tools" "origin/$BASE_REF"
            ln -s "$PWD/node_modules" "$base_tools/node_modules"
            runner="$base_tools/scripts/agent-tools/fix-round-guard"
          else
            echo "the base branch has no fix-round guard yet (this pull request adds it): running the pull request's own copy" >&2
          fi
          require=()
          if [ "$FIX_ROUND_LABEL" = true ]; then require=(--require-manifest); fi
          CLEARCASE_NODE=$(command -v bun) "$runner" --root "$head" --base "origin/$BASE_REF" --branch "$HEAD_REF" \
            --receipts "$RUNNER_TEMP/receipts" "${require[@]}"
      # Fails the job unless every receipt (check, test, gate-hosted) is PASS for this checkout and every tracked test
      # file ran with no failed or skipped test; writes the job summary and summary.json, which name each problem and
      # how to reproduce it.
      - name: summary
        if: always()
        run: bun scripts/ci/summary.ts "$RUNNER_TEMP/receipts" check test gate-hosted
      - name: store verdict
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - "$RUNNER_TEMP/receipts" <<'PY'
          import json, os, pathlib, re, shutil, stat, subprocess, sys, tempfile
          sha, run, attempt = (os.environ[k] for k in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
          if not re.fullmatch(r"[0-9a-f]{40}", sha) or not all(re.fullmatch(r"[0-9]+", x) for x in (run, attempt)):
              raise SystemExit("invalid CI store key")
          store = pathlib.Path.home() / "ci-results"
          store.mkdir(mode=0o700, exist_ok=True)
          if not stat.S_ISDIR(store.lstat().st_mode) or store.resolve() != store:
              raise SystemExit("unsafe CI store root")
          target = store / f"{sha}-{run}-{attempt}"
          staging = pathlib.Path(tempfile.mkdtemp(prefix=f".{target.name}-", dir=store))
          try:
              source = pathlib.Path(sys.argv[1]).absolute()
              def confined(fd):
                  if not pathlib.Path(os.readlink(f"/proc/self/fd/{fd}")).is_relative_to(source):
                      raise SystemExit("receipt path resolves outside source")
              try:
                  info = source.lstat()
              except FileNotFoundError:
                  info = None
              if info is not None:
                  if not stat.S_ISDIR(info.st_mode) or source.resolve() != source:
                      raise SystemExit("unsafe or symlinked receipt root")
                  source_fd = os.open(source, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  try:
                      confined(source_fd)
                      for directory, dirs, files, directory_fd in os.fwalk(".", dir_fd=source_fd, follow_symlinks=False):
                          confined(directory_fd)
                          for name in dirs + files:
                              info = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                              expected = stat.S_ISDIR if name in dirs else stat.S_ISREG
                              if not expected(info.st_mode):
                                  raise SystemExit("unsafe or symlinked receipt entry")
                          for name in files:
                              # Persist structured receipts and summaries only; raw output may contain secrets.
                              if name != "receipt.json" and not (directory == "." and name in ("summary.json", "summary.md")):
                                  continue
                              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory_fd)
                              with os.fdopen(fd, "rb") as incoming:
                                  confined(incoming.fileno())
                                  if not stat.S_ISREG(os.fstat(incoming.fileno()).st_mode):
                                      raise SystemExit("unsafe receipt file")
                                  destination = staging / directory / name
                                  destination.parent.mkdir(parents=True, exist_ok=True)
                                  with destination.open("wb") as outgoing:
                                      shutil.copyfileobj(incoming, outgoing)
                  finally:
                      os.close(source_fd)
              keys = ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME", "GITHUB_REF", "RUNNER_NAME", "PR_HEAD_SHA")
              meta = {k: os.environ.get(k, "") for k in keys}
              head = subprocess.run(["git", "rev-parse", "HEAD"], text=True, capture_output=True)
              meta["checkout_head"] = head.stdout.strip() if head.returncode == 0 else ""
              (staging / "run-metadata.json").write_text(json.dumps(meta, indent=2) + "\n")
              try:
                  summary = json.loads((staging / "summary.json").read_text())
              except (OSError, ValueError):
                  summary = {}
              passed = (isinstance(summary, dict) and os.environ["JOB_STATUS"] == "success" and meta["checkout_head"] == sha
                        and summary.get("head") == sha and summary.get("verdict") == "PASS")
              verdict = "PASS" if passed else "FAIL"
              (staging / "verdict.txt").write_text(f"{verdict} {sha}\n")
              staging.rename(target)
              print(f"{verdict} {sha}\nreceipts {target}")
          finally:
              if staging.exists():
                  shutil.rmtree(staging)
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
